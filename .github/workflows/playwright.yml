name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      browser:
        description: "Browser to run on (manual runs)"
        required: true
        default: "chromium"
        type: choice
        options:
          - chromium
          - firefox
          - webkit
      spec:
        description: "Spec to run (manual runs)"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - tests/system/storage.spec.js
          - tests/system/notifications.spec.js
          - tests/system/language.spec.js
          - tests/system/geolocation.spec.js
          - tests/system/cookie.spec.js
          - tests/system/browser_info.spec.js
          - tests/intermediate/sliders.spec.js
          - tests/intermediate/progress.spec.js
          - tests/intermediate/mouse_interactions.spec.js
          - tests/intermediate/file_ops.spec.js
          - tests/intermediate/drag_drop.spec.js
          - tests/intermediate/date_pickers.spec.js
          - tests/intermediate/copy_paste.spec.js
          - tests/intermediate/auto_suggest.spec.js
          - tests/home.spec.js
          - tests/buggy/duplicate_ids.spec.js
          - tests/buggy/race_condition.spec.js
          - tests/buggy/overlapping.spec.js
          - tests/buggy/double_click.spec.js
          - tests/buggy/hidden_input.spec.js
          - tests/buggy/disabled_button.spec.js
          - tests/buggy/dynamic_ids.spec.js
          - tests/buggy/delayed_loading.spec.js
          - tests/buggy/viewport.spec.js
          - tests/buggy/common_pitfalls.spec.js
          - tests/buggy/stale_reference.spec.js
          - tests/buggy/case_sensitive.spec.js
          - tests/buggy/whitespace.spec.js
          - tests/complex/retry_logic.spec.js
          - tests/complex/realtime_ws.spec.js
          - tests/complex/realtime_poll.spec.js
          - tests/complex/hidden_elements.spec.js
          - tests/complex/dynamic_table.spec.js
          - tests/complex/delayed_loading.spec.js
          - tests/complex/api_dynamic.spec.js
          - tests/business/user_auth.spec.js
          - tests/business/shopping_cart.spec.js
          - tests/business/product_filters.spec.js
          - tests/business/contact_form.spec.js
          - tests/basic/text_inputs.spec.js
          - tests/basic/radio.spec.js
          - tests/basic/password.spec.js
          - tests/basic/links.spec.js
          - tests/basic/form_actions.spec.js
          - tests/basic/dropdown.spec.js
          - tests/basic/checkbox.spec.js
          - tests/basic/buttons.spec.js
          - tests/advanced/toast.spec.js
          - tests/advanced/shadow_dom.spec.js
          - tests/advanced/popups_modals.spec.js
          - tests/advanced/multiple_windows.spec.js
          - tests/advanced/infinite_scroll.spec.js
          - tests/advanced/iframes.spec.js
          - tests/advanced/hidden_elements.spec.js
          - tests/advanced/dynamic_ids.spec.js
          - tests/advanced/charts.spec.js
          - tests/advanced/canvas.spec.js
  schedule:
    - cron: '0 20 * * *'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Build Test Command
        id: cmd
        shell: bash
        run: |
          set -euo pipefail
          TEST_CMD="npx playwright test"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TEST_CMD="$TEST_CMD --project=${{ github.event.inputs.browser }}"
            if [[ "${{ github.event.inputs.spec }}" != "all" ]]; then
              TEST_CMD="$TEST_CMD ${{ github.event.inputs.spec }}"
            fi
          fi
          echo "test_cmd=$TEST_CMD" >> "$GITHUB_OUTPUT"
      - name: Run Playwright tests
        run: ${{ steps.cmd.outputs.test_cmd }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: test-results
          path: test-results/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: allure-results
          path: allure-results/
          retention-days: 14
